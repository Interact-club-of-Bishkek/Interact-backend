<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interact Club | Кабинет Президента</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00c6ff; --bg: #020408; --glass: rgba(15, 23, 42, 0.98); }
        body { 
            background: var(--bg); color: white; font-family: 'Inter', sans-serif; 
            background-image: radial-gradient(circle at 50% 0%, #10192e 0%, #020408 100%); 
            min-height: 100vh; overflow-x: hidden;
        }
        .glass-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; }
        
        .sidebar { width: 280px; background: rgba(11, 17, 33, 0.98); border-right: 1px solid rgba(255,255,255,0.05); }
        .side-btn { 
            width: 100%; text-align: left; padding: 16px 20px; font-weight: 800; text-transform: uppercase; 
            font-size: 12px; letter-spacing: 0.05em; border-radius: 16px; transition: all 0.3s; 
            color: #64748b; display: flex; align-items: center; gap: 16px; margin-bottom: 8px;
        }
        .side-btn:hover:not(.active) { color: white; background: rgba(255,255,255,0.05); }
        .side-btn.active { background: rgba(0, 198, 255, 0.1); color: var(--primary); border: 1px solid rgba(0, 198, 255, 0.3); }
        
        .app-card { 
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 20px; transition: all 0.3s ease; cursor: pointer; position: relative;
        }
        .app-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 10px 30px -10px rgba(0, 198, 255, 0.15); }
        
        ::-webkit-scrollbar { width: 4px; }
        @media (min-width: 768px) { ::-webkit-scrollbar { width: 6px; } }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    </style>
</head>
<body class="flex h-screen overflow-hidden relative">

    <div id="toast-container" class="fixed top-5 right-5 left-5 md:left-auto z-[3000] flex flex-col gap-3"></div>
    <div id="sidebarBackdrop" onclick="closeSidebar()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[1500] hidden opacity-0 transition-opacity duration-300 md:hidden"></div>

    <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out z-[2000] flex flex-col flex-shrink-0 shadow-2xl md:shadow-none">
        <div class="p-6 md:p-8 border-b border-white/5 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-black italic uppercase text-white leading-none">Pres<span class="text-primary">Panel</span></h2>
                <p id="userNameLabel" class="text-xs text-gray-400 mt-2 font-semibold">Загрузка...</p>
            </div>
            <button onclick="closeSidebar()" class="md:hidden text-gray-400 hover:text-white text-xl">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <nav class="flex-1 p-4 md:p-6 overflow-y-auto">
            <button onclick="switchTab('commands')" id="tab-commands" class="side-btn active">
                <i class="fas fa-users w-5"></i> Команды
            </button>
            <button onclick="switchTab('volunteers')" id="tab-volunteers" class="side-btn">
                <i class="fas fa-hands-helping w-5"></i> Набор волонтеров
            </button>
        </nav>
        <div class="p-4 md:p-6 border-t border-white/5">
            <button onclick="logout()" class="w-full py-3 rounded-xl bg-red-500/10 text-red-500 font-bold uppercase text-xs hover:bg-red-500 hover:text-white transition">
                <i class="fas fa-power-off mr-2"></i>Выйти
            </button>
        </div>
    </aside>

    <main class="flex-1 h-full overflow-y-auto p-4 md:p-10 relative flex flex-col">
        <header class="mb-6 md:mb-8 glass-card p-4 md:p-6 flex-shrink-0">
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4">
                
                <div class="flex items-center gap-4 w-full xl:w-auto">
                    <button onclick="openSidebar()" class="md:hidden w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white hover:bg-white/10 transition shrink-0">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 id="pageTitle" class="text-xl md:text-3xl font-black uppercase italic tracking-wide truncate">Набор в команды</h1>
                </div>
                
                <div class="flex flex-col sm:flex-row xl:flex-row items-center gap-3 w-full xl:w-auto flex-wrap">
                    <!-- Поисковик по ФИО -->
                    <div class="relative w-full sm:w-auto flex-1 xl:w-48">
                        <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Поиск по ФИО..." class="w-full bg-black/40 border border-white/10 rounded-xl pl-10 pr-4 py-3 sm:py-2 text-xs font-bold text-white focus:outline-none focus:border-primary transition">
                        <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500 text-xs pointer-events-none"></i>
                    </div>

                    <!-- Фильтр -->
                    <div class="relative w-full sm:w-auto flex-1 xl:w-48">
                        <select id="itemFilter" onchange="applyFilter(this.value)" class="w-full bg-black/40 border border-white/10 rounded-xl pl-4 pr-10 py-3 sm:py-2 text-xs font-bold uppercase tracking-wider text-white focus:outline-none focus:border-primary appearance-none cursor-pointer">
                            <option value="all">⚡ Все направления</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-primary text-xs pointer-events-none"></i>
                    </div>

                    <!-- Табы статусов -->
                    <div class="flex bg-black/40 rounded-xl p-1 border border-white/10 shrink-0 w-full sm:w-auto">
                        <button onclick="switchStatus('pending')" id="status-pending" class="flex-1 sm:flex-none px-3 py-2.5 sm:py-1.5 rounded-lg text-[10px] sm:text-xs font-bold uppercase bg-primary text-white transition text-center">Ожидают</button>
                        <button onclick="switchStatus('accepted')" id="status-accepted" class="flex-1 sm:flex-none px-3 py-2.5 sm:py-1.5 rounded-lg text-[10px] sm:text-xs font-bold uppercase text-gray-400 hover:text-white transition text-center">Принятые</button>
                        <button onclick="switchStatus('stage_3')" id="status-stage3" class="hidden flex-1 sm:flex-none px-3 py-2.5 sm:py-1.5 rounded-lg text-[10px] sm:text-xs font-bold uppercase text-gray-400 hover:text-white transition text-center">3 этап</button>
                    </div>

                    <!-- Кнопки генерации PDF -->
                    <button id="btnPdfSchedule" onclick="downloadPdf('schedule')" class="hidden w-full sm:w-auto px-4 py-3 sm:py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold uppercase transition flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(168,85,247,0.3)]">
                        <i class="fas fa-file-pdf text-sm"></i> Расписание
                    </button>

                    <button id="btnPdfTable" onclick="downloadPdf('stage3_table')" class="hidden w-full sm:w-auto px-4 py-3 sm:py-2 bg-pink-600 hover:bg-pink-500 text-white rounded-xl text-xs font-bold uppercase transition flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(219,39,119,0.3)]">
                        <i class="fas fa-table text-sm"></i> Таблица
                    </button>

                    <button id="btnPdfList" onclick="downloadPdf('stage3_list')" class="hidden w-full sm:w-auto px-4 py-3 sm:py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold uppercase transition flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(79,70,229,0.3)]">
                        <i class="fas fa-list text-sm"></i> Список
                    </button>
                </div>
            </div>
        </header>

        <section id="sec-commands" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-6 pb-20">
            <div class="col-span-full text-center py-20 text-gray-500"><i class="fas fa-circle-notch fa-spin text-3xl"></i></div>
        </section>

        <section id="sec-volunteers" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-6 pb-20 hidden">
            <div class="col-span-full text-center py-20 text-gray-500"><i class="fas fa-circle-notch fa-spin text-3xl"></i></div>
        </section>
    </main>

    <!-- Модальное окно просмотра заявки -->
    <div id="appModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[2000] hidden flex items-end md:items-center justify-center md:p-4 opacity-0 transition-opacity duration-300">
        <div class="glass-card w-full max-w-2xl max-h-[92vh] md:max-h-[85vh] flex flex-col relative transform translate-y-full md:translate-y-0 md:scale-95 transition-transform duration-300 rounded-t-[2.5rem] md:rounded-3xl overflow-hidden shadow-2xl" id="appModalInner">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 md:top-6 md:right-6 w-9 h-9 flex items-center justify-center rounded-full bg-white/10 text-white hover:bg-white/20 text-lg z-20 transition"><i class="fas fa-times"></i></button>
            
            <div class="p-6 md:p-8 border-b border-white/10 bg-black/30 flex-shrink-0">
                <div class="text-[10px] font-black text-primary uppercase tracking-widest mb-1" id="modalBadge">Команда</div>
                <h3 class="text-lg md:text-xl font-black uppercase italic text-white leading-tight pr-10" id="modalName">Имя Кандидата</h3>
            </div>
            
            <div class="p-6 md:p-8 overflow-y-auto flex-1 custom-scrollbar" id="modalAnswers">
                <!-- Контент ответов и файлов -->
            </div>
            
            <div class="p-4 md:p-6 border-t border-white/10 bg-black/60 backdrop-blur-md flex flex-col sm:flex-row items-center justify-between gap-3 flex-shrink-0">
                <!-- Навигация -->
                <div class="flex items-center justify-between sm:justify-start gap-2 w-full sm:w-auto">
                    <button id="btnPrevApp" onclick="navigateModal(-1)" class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-xs font-black uppercase text-gray-300 hover:text-white hover:bg-white/10 transition"><i class="fas fa-chevron-left mr-1"></i> Пред.</button>
                    <span id="modalCounter" class="text-[10px] font-black uppercase tracking-widest text-gray-400 px-2 shrink-0">1 / 10</span>
                    <button id="btnNextApp" onclick="navigateModal(1)" class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-xs font-black uppercase text-gray-300 hover:text-white hover:bg-white/10 transition">След. <i class="fas fa-chevron-right ml-1"></i></button>
                </div>

                <!-- Контейнер для кнопок действий (Принять / 3 Этап) -->
                <div id="modalActionButtons" class="w-full sm:w-auto">
                    <!-- Заполняется через JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = {
            profile: '/api/profile/',
            commandsApps: '/commands-applications/', 
            volunteersApps: '/api/recruitments/applications/', 
            volunteersStatus: '/api/applications/',  
            pdfDownload: '/api/applications/download-schedule-pdf/',
            pdfStage3Table: '/api/applications/download-stage3-table/', // Новое
            pdfStage3List: '/api/applications/download-stage3-list/'    // Новое
        };

        let state = {
            token: localStorage.getItem('access'),
            activeTab: 'commands',
            activeStatus: 'pending',
            filterValue: 'all',
            searchQuery: '',
            commandsData: [],
            volunteersData: [],
            currentFilteredList: [], 
            currentModalIndex: 0,
            currentApp: null 
        };

        function openSidebar() {
            document.getElementById('sidebar').classList.remove('-translate-x-full');
            document.getElementById('sidebarBackdrop').classList.remove('hidden');
            setTimeout(() => document.getElementById('sidebarBackdrop').classList.remove('opacity-0'), 10);
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebarBackdrop').classList.add('opacity-0');
            setTimeout(() => document.getElementById('sidebarBackdrop').classList.add('hidden'), 300);
        }

        async function init() {
            if (!state.token) { location.href = '/login/'; return; } 
            
            try {
                const res = await fetch(API.profile, { headers: { 'Authorization': `Bearer ${state.token}` } });
                if (res.ok) {
                    const user = await res.json();
                    document.getElementById('userNameLabel').innerText = `${user.first_name || user.username || 'Админ'} (${user.role || 'Президент'})`;
                }
            } catch (e) {}
            
            await fetchData();
        }

        async function fetchData() {
            const h = { 'Authorization': `Bearer ${state.token}` };
            try {
                const [cmdRes, volRes] = await Promise.all([
                    fetch(API.commandsApps + '?limit=1000', { headers: h }),
                    fetch(API.volunteersApps + '?limit=1000', { headers: h })
                ]);

                if (cmdRes.status === 401 || volRes.status === 401) { logout(); return; }

                const cmdData = await cmdRes.json();
                const volData = await volRes.json();

                state.commandsData = Array.isArray(cmdData) ? cmdData : (cmdData.results || []);
                state.volunteersData = Array.isArray(volData) ? volData : (volData.results || []);

                updateFilterDropdown();
                renderViews();
            } catch (e) {
                showToast("Ошибка загрузки заявок", "error");
            }
        }

        function updateFilterDropdown() {
            const select = document.getElementById('itemFilter');
            let options = `<option value="all">⚡ Все направления</option>`;
            
            const apps = state.activeTab === 'commands' ? state.commandsData : state.volunteersData;
            const key = state.activeTab === 'commands' ? 'command_title' : 'recruitment_title'; 
            
            const uniqueTitles = [...new Set(apps.map(a => a[key] || a.recruitment_slug).filter(Boolean))];
            
            if (uniqueTitles.length === 0 && state.activeTab === 'volunteers') {
                options = `<option value="all">Общий набор</option>`;
            } else {
                uniqueTitles.forEach(title => { options += `<option value="${title}">${title}</option>`; });
            }
            
            select.innerHTML = options;
            if (uniqueTitles.includes(state.filterValue)) select.value = state.filterValue;
            else { state.filterValue = 'all'; select.value = 'all'; }
        }

        function applyFilter(value) {
            state.filterValue = value;
            renderViews();
        }

        function handleSearch(value) {
            state.searchQuery = value.toLowerCase().trim();
            renderViews();
        }

        function extractName(app) {
            if (app.applicant_name) return app.applicant_name;
            
            const answers = app.formatted_answers || app.answers;
            if (answers) {
                if (typeof answers === 'object' && !Array.isArray(answers)) {
                    for (let [key, val] of Object.entries(answers)) {
                        const lowerKey = key.toLowerCase();
                        if (lowerKey.includes('имя') || lowerKey.includes('фио') || lowerKey.includes('name') || lowerKey.includes('фамилия')) {
                            if (val && typeof val === 'string') return val;
                        }
                    }
                    const vals = Object.values(answers);
                    if (vals.length > 0 && typeof vals[0] === 'string') return vals[0];
                }
            }
            return 'Неизвестный кандидат';
        }

        function renderViews() {
            if (state.activeTab === 'commands') renderCommands();
            else renderVolunteers();
        }

        function renderCommands() {
            const container = document.getElementById('sec-commands');
            const filtered = state.commandsData.filter(a => {
                const name = extractName(a).toLowerCase();
                const statusMatch = (a.status || 'pending').toLowerCase() === state.activeStatus;
                const filterMatch = state.filterValue === 'all' || a.command_title === state.filterValue;
                const searchMatch = state.searchQuery === '' || name.includes(state.searchQuery);
                return statusMatch && filterMatch && searchMatch;
            });
            
            state.currentFilteredList = filtered;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full py-16 text-center text-gray-500 font-bold uppercase text-xs border-2 border-dashed border-white/10 rounded-2xl mx-2">Нет заявок по фильтру</div>`;
                return;
            }

            container.innerHTML = filtered.map((app, index) => {
                const name = extractName(app);
                return `
                <div class="app-card p-5 md:p-6 border-l-4 border-l-primary" onclick="openModal(${index})">
                    <div class="flex justify-between items-start mb-3 md:mb-4 gap-2">
                        <span class="text-[9px] font-black uppercase px-2 py-1 bg-white/10 text-white rounded truncate">${app.command_title || 'Команда'}</span>
                        <span class="text-[10px] text-gray-500 shrink-0">${new Date(app.created_at).toLocaleDateString()}</span>
                    </div>
                    <h4 class="text-lg md:text-xl font-bold text-white mb-2 line-clamp-1">${name}</h4>
                    <p class="text-[11px] md:text-xs text-gray-400 italic">Нажмите, чтобы просмотреть анкету...</p>
                </div>
                `;
            }).join('');
        }

        function renderVolunteers() {
            const container = document.getElementById('sec-volunteers');
            const filtered = state.volunteersData.filter(a => {
                const name = extractName(a).toLowerCase();
                const statusMatch = (a.status || 'pending').toLowerCase() === state.activeStatus;
                const titleMatch = a.recruitment_title || a.recruitment_slug || 'all';
                const filterMatch = state.filterValue === 'all' || titleMatch === state.filterValue;
                const searchMatch = state.searchQuery === '' || name.includes(state.searchQuery);
                return statusMatch && filterMatch && searchMatch;
            });

            state.currentFilteredList = filtered;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full py-16 text-center text-gray-500 font-bold uppercase text-xs border-2 border-dashed border-white/10 rounded-2xl mx-2">Нет заявок по фильтру</div>`;
                return;
            }

            container.innerHTML = filtered.map((app, index) => {
                const name = extractName(app);
                const recruitTitle = app.recruitment_title || app.recruitment_slug || 'Волонтерство';
                
                let borderColor = 'border-l-primary'; // pending
                if (state.activeStatus === 'accepted') borderColor = 'border-l-green-500';
                if (state.activeStatus === 'stage_3') borderColor = 'border-l-purple-500';

                return `
                <div class="app-card p-5 md:p-6 border-l-4 ${borderColor}" onclick="openModal(${index})">
                    <div class="flex justify-between items-start mb-3 md:mb-4 gap-2">
                        <span class="text-[9px] font-black uppercase px-2 py-1 bg-white/10 text-white rounded truncate">${recruitTitle}</span>
                        <span class="text-[10px] text-gray-500 shrink-0">${new Date(app.created_at).toLocaleDateString()}</span>
                    </div>
                    <h4 class="text-lg md:text-xl font-bold text-white mb-1 line-clamp-1">${name}</h4>
                    <p class="text-[11px] md:text-xs text-gray-400">Посмотреть ответы...</p>
                </div>
                `;
            }).join('');
        }

        function navigateModal(direction) {
            const newIndex = state.currentModalIndex + direction;
            if (newIndex >= 0 && newIndex < state.currentFilteredList.length) {
                openModal(newIndex);
            }
        }

        function openModal(index) {
            state.currentModalIndex = index;
            const app = state.currentFilteredList[index];
            state.currentApp = app;

            document.getElementById('btnPrevApp').style.visibility = index > 0 ? 'visible' : 'hidden';
            document.getElementById('btnNextApp').style.visibility = index < (state.currentFilteredList.length - 1) ? 'visible' : 'hidden';
            document.getElementById('modalCounter').innerText = `${index + 1} / ${state.currentFilteredList.length}`;

            const isVolunteer = (state.activeTab === 'volunteers');
            document.getElementById('modalBadge').innerText = isVolunteer ? 'Набор: ' + (app.recruitment_title || app.recruitment_slug || 'Волонтер') : 'Команда: ' + (app.command_title || '');
            document.getElementById('modalName').innerText = extractName(app);

            let answersHtml = '';
            const answersToRender = app.formatted_answers || app.answers;

            if (answersToRender && Object.keys(answersToRender).length > 0) {
                for (let [question, answer] of Object.entries(answersToRender)) {
                    if (question.startsWith('q_') && !isNaN(question.replace('q_', ''))) {
                        question = `Вопрос (№${question.replace('q_', '')})`;
                    }
                    if (Array.isArray(answer)) answer = answer.join(', ');

                    answersHtml += `
                    <div class="mb-6">
                        <p class="text-[10px] text-primary uppercase font-black mb-2 tracking-widest flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-primary/50 shrink-0"></span> ${question}
                        </p>
                        <div class="bg-white/5 p-4 rounded-xl border border-white/5 text-sm italic text-gray-200 leading-relaxed shadow-inner whitespace-pre-line">
                            ${(answer !== null && answer !== undefined && answer !== "") ? answer : "—"}
                        </div>
                    </div>`;
                }
            } else {
                answersHtml = '<div class="text-gray-500 italic mb-4">Текстовые ответы отсутствуют.</div>';
            }

            if (app.files && app.files.length > 0) {
                answersHtml += `<div class="mt-8 pt-6 border-t border-white/10 space-y-3"><h4 class="text-xs font-black uppercase text-gray-400 tracking-widest mb-3">Прикрепленные файлы</h4>`;
                app.files.forEach(f => {
                    if (!f.file) return;
                    let fileUrl = f.file.replace(/^https?:\/\/[^\/]+/, ''); 
                    fileUrl = window.location.origin + fileUrl;
                    const isImage = /\.(jpg|jpeg|png|webp|gif|bmp|svg)(\?.*)?$/i.test(fileUrl);
                    
                    if (isImage) {
                        answersHtml += `<div class="mb-3"><p class="text-[10px] text-gray-400 mb-1 uppercase font-semibold">${f.label || 'Фотография'}</p><a href="${fileUrl}" target="_blank" class="block overflow-hidden rounded-xl border border-white/10 group bg-black/40"><img src="${fileUrl}" alt="Файл" class="w-full max-h-60 object-contain group-hover:scale-105 transition duration-300"></a></div>`;
                    } else {
                        answersHtml += `<a href="${fileUrl}" target="_blank" class="flex items-center gap-3 p-3 bg-white/5 rounded-xl hover:bg-white/10 transition border border-white/5"><div class="w-10 h-10 rounded-lg bg-primary/20 text-primary flex items-center justify-center text-base"><i class="fas fa-file"></i></div><div class="overflow-hidden"><p class="text-sm font-bold text-white truncate">${f.label || 'Документ'}</p><p class="text-xs text-primary mt-0.5">Открыть файл <i class="fas fa-external-link-alt ml-1"></i></p></div></a>`;
                    }
                });
                answersHtml += `</div>`;
            }
            document.getElementById('modalAnswers').innerHTML = answersHtml;

            const actionsContainer = document.getElementById('modalActionButtons');
            let currentStatus = (app.status || 'pending').toLowerCase();
            
            if (currentStatus === 'pending') {
                actionsContainer.innerHTML = `
                    <button onclick="updateStatus('accepted')" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-primary text-white font-black uppercase text-xs md:text-sm tracking-wide hover:bg-white hover:text-primary transition shadow-[0_0_20px_rgba(0,198,255,0.2)]">
                        <i class="fas fa-check-double mr-2"></i> Принять
                    </button>
                `;
            } else if (currentStatus === 'accepted') {
                if (isVolunteer) {
                    actionsContainer.innerHTML = `
                        <button onclick="updateStatus('stage_3')" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-purple-600 text-white font-black uppercase text-xs md:text-sm tracking-wide hover:bg-white hover:text-purple-600 transition shadow-[0_0_20px_rgba(147,51,234,0.3)]">
                            <i class="fas fa-share-square mr-2"></i> На 3 этап
                        </button>
                    `;
                } else {
                    actionsContainer.innerHTML = `
                        <button disabled class="w-full sm:w-auto px-6 py-3 rounded-xl bg-green-500/10 text-green-500 border border-green-500/20 font-black uppercase text-xs md:text-sm cursor-not-allowed">
                            <i class="fas fa-check"></i> Уже в составе
                        </button>
                    `;
                }
            } else if (currentStatus === 'stage_3') {
                actionsContainer.innerHTML = `
                    <button disabled class="w-full sm:w-auto px-6 py-3 rounded-xl bg-purple-500/10 text-purple-500 border border-purple-500/20 font-black uppercase text-xs md:text-sm cursor-not-allowed">
                        <i class="fas fa-check-circle mr-2"></i> Уже на 3 этапе
                    </button>
                `;
            }

            const modal = document.getElementById('appModal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    if (window.innerWidth < 768) document.getElementById('appModalInner').classList.remove('translate-y-full'); 
                    else document.getElementById('appModalInner').classList.remove('scale-95'); 
                }, 10);
            }
        }

        function closeModal() {
            const modal = document.getElementById('appModal');
            const inner = document.getElementById('appModalInner');
            modal.classList.add('opacity-0');
            if (window.innerWidth < 768) inner.classList.add('translate-y-full');
            else inner.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); state.currentApp = null; }, 300); 
        }

        async function updateStatus(newStatus) {
            if (!state.currentApp) return;
            
            const actionsContainer = document.getElementById('modalActionButtons');
            actionsContainer.innerHTML = `<button disabled class="w-full sm:w-auto px-6 py-3 rounded-xl bg-gray-600 text-white font-black uppercase text-xs md:text-sm"><i class="fas fa-spinner fa-spin mr-2"></i> Обработка...</button>`;

            const app = state.currentApp;
            const isVol = (state.activeTab === 'volunteers');
            
            const url = isVol 
                ? `${API.volunteersStatus}${app.id}/status/` 
                : `${API.commandsApps}${app.id}/accept/`;
            
            const bodyData = isVol ? { status: newStatus } : { status: 'accepted' };
            
            try {
                const res = await fetch(url, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                if (res.ok) {
                    showToast(newStatus === 'stage_3' ? "Переведен на 3 этап!" : "Успешно принято!", "success");
                    app.status = newStatus;
                    
                    closeModal();
                    setTimeout(() => { renderViews(); }, 300);
                    
                } else {
                    const data = await res.json().catch(() => ({}));
                    showToast(data.error || "Ошибка сервера", "error");
                    openModal(state.currentModalIndex);
                }
            } catch (e) {
                console.error("Ошибка в скрипте или сети:", e);
                showToast("Произошла ошибка!", "error");
            }
        }

        // Обновленная функция для скачивания разных PDF
        function downloadPdf(type) {
            showToast("Генерация PDF (Ожидайте)...", "success");
            
            let endpoint = '';
            let filename = '';

            // Определяем, куда делаем запрос в зависимости от кнопки
            if (type === 'schedule') {
                endpoint = API.pdfDownload;
                filename = `Расписание_Волонтеры_${new Date().toLocaleDateString()}.pdf`;
            } else if (type === 'stage3_table') {
                endpoint = API.pdfStage3Table;
                filename = `Таблица_3_Этап_${new Date().toLocaleDateString()}.pdf`;
            } else if (type === 'stage3_list') {
                endpoint = API.pdfStage3List;
                filename = `Список_3_Этап_${new Date().toLocaleDateString()}.pdf`;
            }

            let url = endpoint;
            if (state.filterValue !== 'all') {
                url += `?slug=${state.filterValue}`;
            }

            fetch(url, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${state.token}` }
            })
            .then(res => {
                if (!res.ok) throw new Error("Ошибка при формировании PDF");
                return res.blob();
            })
            .then(blob => {
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);
                a.remove();
            })
            .catch(err => {
                showToast("Не удалось скачать PDF", "error");
            });
        }

        function switchTab(tab) {
            state.activeTab = tab;
            state.filterValue = 'all';
            
            document.getElementById('tab-commands').classList.toggle('active', tab === 'commands');
            document.getElementById('tab-volunteers').classList.toggle('active', tab === 'volunteers');
            
            document.getElementById('sec-commands').classList.toggle('hidden', tab !== 'commands');
            document.getElementById('sec-volunteers').classList.toggle('hidden', tab !== 'volunteers');
            
            document.getElementById('pageTitle').innerText = tab === 'commands' ? 'Набор в команды' : 'Набор волонтеров';
            
            const stage3Btn = document.getElementById('status-stage3');
            if (tab === 'volunteers') {
                stage3Btn.classList.remove('hidden');
            } else {
                stage3Btn.classList.add('hidden');
                if (state.activeStatus === 'stage_3') switchStatus('accepted');
            }

            updateFilterDropdown();
            togglePdfButton();
            renderViews();
            
            if(window.innerWidth < 768) closeSidebar();
        }

        // Обновленная функция управления видимостью кнопок PDF
        function switchStatus(status) {
            state.activeStatus = status;
            
            const btns = {
                'pending': document.getElementById('status-pending'),
                'accepted': document.getElementById('status-accepted'),
                'stage_3': document.getElementById('status-stage3')
            };

            const baseClass = "flex-1 sm:flex-none px-3 py-2.5 sm:py-1.5 rounded-lg text-[10px] sm:text-xs font-bold uppercase transition text-center";

            for (const key in btns) {
                if (!btns[key]) continue;
                if (key === status) {
                    btns[key].className = `${baseClass} bg-primary text-white`;
                } else {
                    const hiddenClass = (key === 'stage_3' && state.activeTab === 'commands') ? 'hidden ' : '';
                    btns[key].className = `${hiddenClass}${baseClass} text-gray-400 hover:text-white bg-black/40`;
                }
            }

            togglePdfButton();
            renderViews();
        }

        // Включаем нужные кнопки в зависимости от статуса
        function togglePdfButton() {
            const btnSchedule = document.getElementById('btnPdfSchedule');
            const btnTable = document.getElementById('btnPdfTable');
            const btnList = document.getElementById('btnPdfList');

            // Скрываем все
            btnSchedule.classList.add('hidden');
            btnTable.classList.add('hidden');
            btnList.classList.add('hidden');

            if (state.activeTab === 'volunteers') {
                if (state.activeStatus === 'accepted') {
                    // Во вкладке принятых показываем кнопку Расписания
                    btnSchedule.classList.remove('hidden');
                } else if (state.activeStatus === 'stage_3') {
                    // Во вкладке 3 этапа показываем Таблицу и Список
                    btnTable.classList.remove('hidden');
                    btnList.classList.remove('hidden');
                }
            }
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            const color = type === 'error' ? 'bg-red-500' : 'bg-green-500';
            const icon = type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle';
            
            el.className = `flex items-center gap-3 px-5 py-4 rounded-xl shadow-2xl text-white font-bold text-xs md:text-sm transform transition-all duration-300 translate-x-full z-[3000] ${color}`;
            el.innerHTML = `<i class="fas ${icon} text-lg md:text-xl"></i> ${msg}`;
            
            container.appendChild(el);
            setTimeout(() => el.classList.remove('translate-x-full'), 10);
            setTimeout(() => {
                el.classList.add('translate-x-full');
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        function logout() {
            localStorage.removeItem('access');
            localStorage.removeItem('refresh');
            location.href = '/login/';
        }

        init();
    </script>
</body>
</html>
